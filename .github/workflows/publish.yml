name: Publish to npm (staged)

# Triggered by a GitHub Release being published.
#
# Uses npm STAGED publishing: CI stages the package (no 2FA needed), the
# maintainer then reviews and approves it on npmjs.com (Staged Packages tab)
# with the hardware key. This pairs with Trusted Publishing (OIDC) so no
# token or OTP ever exists in CI.
#
# One-time setup in the npm package settings:
#   Trusted Publisher -> owner zlqd123 / repo dsh-composer-keys / file publish.yml

on:
  release:
    types: [published]

permissions:
  id-token: write # OIDC — the key to Trusted Publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 bundles an npm too old for `npm stage`; CI always uses the
      # latest npm so the staged commands exist.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Run tests
        run: node --test test/*.test.mjs

      # Fail before staging if the release tag and package.json disagree.
      - name: Verify version matches release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json ($PKG_VERSION) != release tag ($TAG_VERSION)"
            exit 1
          fi

      # Stage instead of publish: no 2FA needed for this step. The package
      # goes live only after the maintainer approves it on npmjs.com
      # (Staged Packages tab) with the hardware key.
      - name: Stage package
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: 'unused' # required non-empty by setup-node; OIDC is what authenticates

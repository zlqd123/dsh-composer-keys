name: Publish to npm

# Triggered by a GitHub Release being published.
#
# Uses npm Trusted Publishing (OIDC): the workflow's short-lived OIDC token
# is the credential — no stored npm token, no OTP, no hardware key in CI.
#
# One-time registration (already done): package page -> Settings ->
# Trusted Publisher -> owner zlqd123 / repo dsh-composer-keys / publish.yml

on:
  release:
    types: [published]

permissions:
  id-token: write # OIDC — the key to Trusted Publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 bundles npm 10.x, which predates Trusted Publishing (OIDC).
      # npm >= 11.5 is required for the OIDC publish path.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Run tests
        run: node --test test/*.test.mjs

      # Fail before publishing if the release tag and package.json disagree.
      - name: Verify version matches release tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json ($PKG_VERSION) != release tag ($TAG_VERSION)"
            exit 1
          fi

      # No NODE_AUTH_TOKEN here: setting it makes npm skip OIDC detection and
      # use the (invalid) token instead. With the env absent, npm's automatic
      # OIDC detection kicks in and authenticates via the trusted publisher.
      - name: Publish
        run: npm publish

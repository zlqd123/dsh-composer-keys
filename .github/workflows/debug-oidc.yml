name: Debug OIDC identity

# One-off diagnostic: decode the OIDC token npm would receive and print its
# identity claims, so they can be compared with the package's configured
# Trusted Publisher (owner / repo / workflow filename).

on:
  workflow_dispatch:

permissions:
  id-token: write # OIDC — needed to even fetch the token
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Decode OIDC token claims
        env:
          AUD: npm:registry.npmjs.org
        run: |
          RESP=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")
          TOKEN=$(echo "$RESP" | jq -r '.value')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::no OIDC token issued — id-token permission missing?"
            echo "$RESP"
            exit 1
          fi
          PAYLOAD=$(echo "$TOKEN" | cut -d'.' -f2 | tr '_-' '/+' | awk '{l=length($0)%4; if(l==2)$0=$0"=="; else if(l==3)$0=$0"="; print}' | base64 -d)
          echo "$PAYLOAD" | jq '{sub, job_workflow_ref, repository, repository_owner, ref}'
